<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0a1e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Primary Meta Tags -->
    <title>Echo – Your Personal AI Assistant</title>
    <meta name="title" content="Echo – Your Personal AI Assistant" />
    <meta name="description" content="Echo is a voice-first AI assistant that helps you manage tasks, reminders, notes, and calendar—all with natural voice commands. Works 95% offline." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vibrant-dragon-echo.vercel.app/" />
    <meta property="og:title" content="Echo – Your Personal AI Assistant" />
    <meta property="og:description" content="Echo is a voice-first AI assistant that helps you manage tasks, reminders, notes, and calendar—all with natural voice commands. Works 95% offline." />
    <meta property="og:image" content="https://vibrant-dragon-echo.vercel.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vibrant-dragon-echo.vercel.app/" />
    <meta name="twitter:title" content="Echo – Your Personal AI Assistant" />
    <meta name="twitter:description" content="Echo is a voice-first AI assistant that helps you manage tasks, reminders, notes, and calendar—all with natural voice commands. Works 95% offline." />
    <meta name="twitter:image" content="https://vibrant-dragon-echo.vercel.app/og-image.svg" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://vibrant-dragon-echo.vercel.app/" />
    
    <style>
      /* Prevent white flash before CSS loads */
      html, body, #root {
        background: #0f0a1e;
        min-height: 100%;
      }
      /* Error fallback styles */
      .error-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e2e8f0;
      }
      .error-fallback-card {
        background: rgba(30, 20, 50, 0.9);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 12px;
        padding: 24px;
        max-width: 400px;
        text-align: center;
      }
      .error-fallback h1 {
        font-size: 1.25rem;
        margin-bottom: 12px;
        color: #f472b6;
      }
      .error-fallback p {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-bottom: 16px;
      }
      .error-fallback button {
        background: linear-gradient(135deg, #a855f7, #ec4899);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .error-fallback button:hover {
        opacity: 0.9;
      }
    </style>
    <script>
      // Global error handler for uncaught errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Global error:', msg, url, lineNo, columnNo, error);
        // Only show fallback if root is empty (app failed to load)
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.innerHTML.trim() === '') {
            root.innerHTML = '<div class="error-fallback"><div class="error-fallback-card"><h1>⚠️ Loading Error</h1><p>The app encountered an error while loading. This might be due to a network issue or browser compatibility.</p><button onclick="window.location.reload()">Reload Page</button></div></div>';
          }
        }, 3000);
        return false;
      };
      // Handle unhandled promise rejections
      window.onunhandledrejection = function(event) {
        console.error('Unhandled rejection:', event.reason);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
