name: Production Smoke Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: prod-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run production smoke checks
        run: node scripts/smoke-prod.mjs

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 PROD Smoke Monitor Failing';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Smoke monitor failed.`,
              `Run: ${runUrl}`,
              `Checks:`,
              `- /api/ai/status (expects 200 application/json configured=true)`,
              `- /login (expects 200 text/html)`,
              `- / (optional) 200 reachability`,
            ].join('\n');

            // Find existing open issue with exact title
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `❗ Failure observed at ${new Date().toISOString()}\n${runUrl}` });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              let labels = [];
              try {
                labels = ['ops','prod-smoke'];
              } catch {}
              const created = await github.rest.issues.create({ owner, repo, title, body, labels });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Close failure issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 PROD Smoke Monitor Failing';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `✅ Recovered at ${new Date().toISOString()}\n${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed issue #${existing.number}`);
            } else {
              core.info('No open failure issue to close.');
            }
